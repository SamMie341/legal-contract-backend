name: legal-contract

services:
  # รัน migration ครั้งเดียวก่อนเริ่ม app (docker compose run --rm migrate)
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy --config prisma7.config.ts
    environment:
      DATABASE_URL: ${DATABASE_URL:?กรุณาตั้ง DATABASE_URL ใน .env.docker}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  api:
    build:
      context: .
      target: runner
    container_name: legal-contract-api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: ${DATABASE_URL:?กรุณาตั้ง DATABASE_URL ใน .env.docker}
      UPLOAD_DIR: /app/uploads/contracts
      UPLOAD_DIR_LEGAL_DOCS: /app/uploads/legal-documents
      UPLOAD_DIR_LEGAL_CASES: /app/uploads/legal-cases
      TICKET_UPLOAD_DIR: /app/uploads/tickets
      PORT: 3001
    # ให้ container เรียก Postgres ที่ติดตั้งบนเครื่อง host ผ่าน host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  uploads:
