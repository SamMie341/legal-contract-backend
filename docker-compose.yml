services:
  db:
    image: postgres:16-alpine
    container_name: legal-contract-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?กรุณาตั้ง POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-legal_contract}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-legal_contract}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # รัน migration ครั้งเดียวก่อนเริ่ม app (docker compose run --rm migrate)
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy --config prisma7.config.ts
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-legal_contract}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runner
    container_name: legal-contract-api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-legal_contract}?schema=public
      UPLOAD_DIR: /app/uploads/contracts
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
